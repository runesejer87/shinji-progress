<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a1b52"/>
      <stop offset="0.55" stop-color="#120d24"/>
      <stop offset="1" stop-color="#07070b"/>
    </radialGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.65" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1638"/>
      <stop offset="1" stop-color="#0d0b1a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="cardclip"><rect x="-170" y="-238" width="340" height="476" rx="30"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="300" fill="#7c3aed" opacity="0.28" filter="url(#glow)"/>

  <!-- back card -->
  <g transform="translate(450 500) rotate(-14)">
    <rect x="-170" y="-238" width="340" height="476" rx="30" fill="#14112a" stroke="#3b2f6b" stroke-width="10"/>
  </g>

  <!-- front holo card -->
  <g transform="translate(560 492) rotate(9)">
    <rect x="-176" y="-244" width="352" height="488" rx="34" fill="url(#holo)" filter="url(#glow)" opacity="0.55"/>
    <rect x="-170" y="-238" width="340" height="476" rx="30" fill="url(#face)" stroke="url(#holo)" stroke-width="14"/>
    <g clip-path="url(#cardclip)">
      <rect x="-60" y="-300" width="90" height="620" fill="url(#shine)" transform="rotate(24)"/>
    </g>
    <!-- progress ring -->
    <circle cx="0" cy="-20" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="26"/>
    <circle cx="0" cy="-20" r="104" fill="none" stroke="url(#holo)" stroke-width="26" stroke-linecap="round"
            stroke-dasharray="490 654" transform="rotate(-90 0 -20)"/>
    <path d="M-44 -18 L-12 14 L50 -52" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- pips -->
    <rect x="-110" y="146" width="150" height="18" rx="9" fill="#ffffff" opacity="0.18"/>
    <rect x="-110" y="180" width="96" height="18" rx="9" fill="#ffffff" opacity="0.1"/>
  </g>

  <!-- sparkles -->
  <path d="M808 246 q10 46 56 56 q-46 10 -56 56 q-10 -46 -56 -56 q46 -10 56 -56z" fill="#fde68a"/>
  <path d="M232 700 q7 32 39 39 q-32 7 -39 39 q-7 -32 -39 -39 q32 -7 39 -39z" fill="#5eead4"/>
  <path d="M262 262 q5 22 27 27 q-22 5 -27 27 q-5 -22 -27 -27 q22 -5 27 -27z" fill="#c4b5fd"/>
</svg>
