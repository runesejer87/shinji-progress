name: Refresh card data

on:
  schedule:
    - cron: '17 5 * * *' # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cards
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data public/cards && [ -z "$(git ls-files --others --exclude-standard public/cards)" ]; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add src/data public/cards
          git commit -m "chore: refresh card data and prices"
          git push
